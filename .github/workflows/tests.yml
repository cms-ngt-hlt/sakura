name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      # The Run3ScoutingAnalysisTools submodule is declared with an SSH URL,
      # so it is deliberately not fetched here (the tests do not need it).
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run the test suite
        run: pytest tests -q

  shellcheck:
    name: ShellCheck (advisory)
    runs-on: ubuntu-latest
    # The tracked scripts still have a handful of ShellCheck errors, so this
    # job only reports them. Drop the line below to make it blocking once the
    # scripts are clean (`shellcheck -S error -e SC2148 $(git ls-files '*.sh')`).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # SC2148 (missing shebang) is excluded: several scripts here are meant
      # to be sourced or pasted rather than executed directly.
      - name: Analyse shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error -e SC2148
