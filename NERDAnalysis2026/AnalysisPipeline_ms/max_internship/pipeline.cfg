# pipeline.cfg single source of truth. Sourced by bash scripts, parsed by the
# Python scripts (via bash). Nothing else may hardcode any of these values.

RUNS=(
  403775
)

DATASET_PATTERN='^/EGamma[0-9]+/[^/]*ZElectron-PromptReco-v[0-9]+/RAW-RECO$'

# --- tags (parallel arrays, same order) ---
TAGS=("HLT" "Prompt" "NGT")
GTAGS=("160X_dataRun3_HLT_v1" "160X_dataRun3_Prompt_v1" "160X_dataRun3_NGT_v4")

# Records whose IOV snapshot is moved to the per-run snapshot time from
# oms_runs.csv (NGT jobs only). Set via GlobalTag.toGet, one entry per
# record, keeping the GT's tag for it; all other records keep the GT's own
# snapshot. Leave empty, SNAPSHOT_RECORDS=(), to apply the snapshot time
# globally (GlobalTag.snapshotTime) instead.
SNAPSHOT_RECORDS=(
    EcalPedestalsRcd
    SiStripBadFiberRcd
    TrackerAlignmentRcd
    SiStripDetVOffRcd
)

# Here are the options for the hltGetConfiguration command
HLT_MENU="/dev/CMSSW_16_0_0/GRun"
ERA="Run3_2026"
L1_MENU="L1Menu_Collisions2026_v1_1_0_xml"
HLT_PATHS="Dataset_TestDataRaw,LocalTestDataRawOutput,Dataset_TestDataScouting,DQMTestDataScoutingOutput,DST_PFScouting*,HLT_TestData_v*,HLTriggerFinalPath,HLT_Ele23_Ele12_CaloIdL_TrackIdL_IsoVL_DZ_v*"

CMSSW_SRC="/afs/cern.ch/work/m/mzarucki/NGT/SAKURA/NERDAnalysisNano/sakura/NERDAnalysis2026/AnalysisPipeline_ms/max_internship/CMSSW_16_0_10/src"

FILELIST="filelist.txt" # the input file that contains all the paths to the raw detector data
EOS_BASE="/eos/cms/store/group/tsg-phase2/user/mzarucki/NERDAnalysisNano/ScoutingNano/Test/ReHLT" # where the files should be sent to upon successful HTCondor job
EOS_XRD="root://eosuser.cern.ch"

# What outputs from cmsRun are we intersted in?
STREAMS=("LocalTestDataRaw" "DQMTestDataScouting")
LOCAL_FILES=("outputLocalTestDataRaw.root" "outputDQMTestDataScouting.root")

# --- batch ---
N_PER_JOB=1
JOB_FLAVOUR="workday" # 8 h
REQUEST_MEMORY_MB=5000
PROXY="x509up_u$(id -u)"

# --- DQM  ---
DQM_DEST_BASE="/eos/cms/store/group/tsg-phase2/user/mzarucki/NERDAnalysisNano/ScoutingNano/Test/DQM"
# Any number of shell recipes; paths are relative to this directory.
DQM_CONFIGS=("dqm/scouting.sh" "dqm/hlt.sh")
DQM_THREADS=24
DQM_WORK_BASE="DQM_work"

# --- DQM batch: one HTCondor job per recipe/tag/run ---
DQM_BACKEND="local"      # "condor" (one job per recipe/tag/run) or "local" (sequential)
DQM_SUBMIT=false           # condor: submit right away; false only writes the files
DQM_JOBS_BASE="DQM_jobs"  # job scripts, condor logs, and artifacts copied back
DQM_JOB_FLAVOUR="tomorrow" # 1 d
DQM_REQUEST_CPUS="$DQM_THREADS" # slots per job; cmsRun still uses DQM_THREADS
DQM_REQUEST_MEMORY_MB=5000
DQM_REQUEST_DISK_KB=1000000 # 1 GB: DQMIO step2.root plus the harvested file
# Glob patterns left out of the artifacts copied back from the worker; empty
# keeps the whole work directory. The cmsRun logs are large and the ROOT files
# are either intermediate or already published.
DQM_ARTIFACT_EXCLUDE=("*.root" "dqm.log" "harvesting.log")

# --- NanoAOD  ---
NANO_DEST_BASE="/eos/cms/store/group/tsg-phase2/user/mzarucki/NERDAnalysisNano/ScoutingNano/Test/NANO"
NANO_CONFIGS=("nano/scoutingNano.sh")
NANO_THREADS=24
NANO_WORK_BASE="NANO_work"

# --- NANO batch: one HTCondor job per recipe/tag/run ---
NANO_BACKEND="local"      # "condor" (one job per recipe/tag/run) or "local" (sequential)
NANO_SUBMIT=false           # condor: submit right away; false only writes the files
NANO_JOBS_BASE="NANO_jobs"  # job scripts, condor logs, and artifacts copied back
NANO_JOB_FLAVOUR="tomorrow" # 1 d
NANO_REQUEST_CPUS="$NANO_THREADS" # slots per job; cmsRun still uses NANO_THREADS
NANO_REQUEST_MEMORY_MB=5000
NANO_REQUEST_DISK_KB=1000000 # 1 GB
NANO_ARTIFACT_EXCLUDE=("*.root" "nano.log")

# --- Plotting ---
# Where the plotting scripts write their PDFs and PNGs, e.g. a CERNBox web
# area; relative paths are relative to this directory.
# Empty: "$DQM_DEST_BASE/plots".
PLOTS_DEST=""
